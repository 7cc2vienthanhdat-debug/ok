name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'libBaconBypass.dylib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile BaconBypass Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -framework AudioToolbox \
            -framework AVFoundation \
            BaconBypass.m \
            -o libBaconBypass.dylib

      - name: Push Dylib to Repo & Create Direct Download Link
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f libBaconBypass.dylib
          git commit -m "Update compiled libBaconBypass.dylib [skip ci]" || echo "No changes to commit"
          git push origin main

          echo "### ✅ Biên dịch thành công!" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[BẤM VÀO ĐÂY ĐỂ TẢI THẲNG libBaconBypass.dylib (KHÔNG NÉN ZIP)](https://github.com/${{ github.repository }}/raw/main/libBaconBypass.dylib)**" >> $GITHUB_STEP_SUMMARY
