name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'libBaconBypass.dylib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile BaconBypass Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -framework AudioToolbox \
            -framework AVFoundation \
            BaconBypass.m \
            -o libBaconBypass.dylib

      - name: Push libBaconBypass.dylib directly to Repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add libBaconBypass.dylib
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update compiled libBaconBypass.dylib" && git push)

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: libBaconBypass
          path: libBaconBypass.dylib
