name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase

    - name: Build iOS App
      run: |
        briefcase create iOS --no-input
        briefcase build iOS --no-input

    - name: Package App folder into a zip/tar for download
      run: |
        cd build/il2cppoffsetanalyzer/ios/xcode/build/Debug-iphonesimulator/
        zip -r Il2CppOffsetAnalyzer.zip Il2CppOffsetAnalyzer.app

    - name: Upload App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-folder
        path: build/il2cppoffsetanalyzer/ios/xcode/build/Debug-iphonesimulator/Il2CppOffsetAnalyzer.zip
